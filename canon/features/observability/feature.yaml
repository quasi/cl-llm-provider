feature:
  name: observability
  version: 1.0.0
  status: stable
  description: |
    Callback mechanisms for logging, tracing, and monitoring LLM API calls.
    Includes hook system for request/response lifecycle events, built-in
    logging hooks, and integration points for external monitoring systems.

depends_on:
  core: true
  features:
    - core-api  # Hooks are invoked during complete/embedding calls
    - streaming  # Stream chunk hooks

contracts:
  - hooks-api  # Hook system contract

properties:
  - hook-safety  # Hooks don't break requests

scenarios: []
# Could add:
# - logging-request-response
# - metrics-collection
# - error-tracking

source_files:
  - src/observability.lisp

documentation:
  - docs/how-to/observability.md
