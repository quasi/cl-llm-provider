strategy:
  name: cl-llm-provider verification strategy
  version: 0.1.0
  description: |
    Verification strategy for cl-llm-provider library using FiveAM test framework,
    property-based testing, and integration tests with mock and real providers.

test_levels:
  unit:
    framework: FiveAM
    description: Unit tests for individual functions and methods
    coverage_target: 90%
    location: tests/
    patterns:
      - test-*.lisp
    execution:
      command: (asdf:test-system :cl-llm-provider)
      timeout: 120

  property:
    framework: cl-quickcheck (or manual property tests)
    description: Property-based tests for token counting, validation, parsing
    coverage_target: key algorithms
    location: tests/
    focus_areas:
      - Token counting accuracy (within bounds)
      - Parameter validation correctness
      - JSON parsing/generation round-trips
      - Response object immutability

  integration:
    framework: FiveAM with mock providers
    description: Integration tests using mock HTTP responses
    coverage_target: all provider implementations
    location: tests/
    patterns:
      - test-*-integration.lisp
    requirements:
      - Mock provider responses
      - No real API calls in CI
      - Isolated from network

  smoke:
    framework: Manual/scripted
    description: Smoke tests with real providers (optional, requires API keys)
    location: tests/smoke/ or docs/examples/
    requirements:
      - API keys in environment variables
      - Only run when explicitly requested
      - Not part of automated CI
    endpoints:
      - OpenAI: POST /v1/chat/completions
      - Anthropic: POST /v1/messages
      - Gemini: POST /v1beta/openai/chat/completions
    validation:
      - Response status 200
      - Response contains expected fields
      - Usage tokens > 0

integration_points:
  http:
    description: HTTP requests to LLM provider APIs
    verification:
      - Mock with drakma/dexador responses
      - Test authentication headers
      - Test request body construction
      - Test error handling (401, 429, 500)
      - Test streaming (SSE parsing)
    anti_patterns:
      - Real API calls in unit tests
      - Hardcoded API keys in tests
      - Tests that depend on external network

  json:
    description: JSON encoding/decoding for requests/responses
    verification:
      - Round-trip tests (encode → decode → equal)
      - Test with real provider response samples
      - Test error handling for malformed JSON
    anti_patterns:
      - Incomplete response mocking
      - Assuming JSON structure without validation

  tools:
    description: Tool definition, validation, approval, execution
    verification:
      - Unit tests for define-tool
      - Validation tests with valid/invalid parameters
      - Approval workflow tests with mock callbacks
      - Execution tests with mock handlers
    anti_patterns:
      - Tools with real side effects in tests
      - Unapproved execution of dangerous tools
      - Tests that don't clean up tool registry

mocking_strategy:
  providers:
    description: Mock provider implementations for testing
    approach:
      - Create test-provider class implementing protocol
      - Return canned responses without HTTP
      - Support tool calls, streaming, embeddings
      - Configurable failure modes (errors, rate limits)

  http:
    description: Mock HTTP responses
    approach:
      - Mock drakma/dexador request functions
      - Return test JSON responses
      - Simulate network errors (timeout, connection refused)
      - Test rate limiting (HTTP 429)

  tools:
    description: Mock tool execution
    approach:
      - Tools with mock handlers (return fixed results)
      - Mock approval callbacks (auto-approve, auto-reject, interactive)
      - Mock validation (always pass, always fail, conditional)

confidence_score:
  calculation: |
    Confidence = (unit_coverage * 0.4) +
                 (integration_tests_pass * 0.3) +
                 (property_tests_exist * 0.2) +
                 (smoke_tests_pass * 0.1)

  target: 0.85

  components:
    unit_coverage:
      weight: 0.4
      target: 0.90
      measurement: code coverage percentage

    integration_tests_pass:
      weight: 0.3
      target: 1.0
      measurement: integration test pass rate

    property_tests_exist:
      weight: 0.2
      target: 1.0
      measurement: key algorithms have property tests

    smoke_tests_pass:
      weight: 0.1
      target: 1.0
      measurement: manual smoke tests with real APIs (optional)

test_data:
  location: tests/fixtures/
  types:
    - Provider response samples (OpenAI, Anthropic, Gemini)
    - Tool definitions (safe, moderate, dangerous)
    - Validation test cases (valid, invalid parameters)
    - Token counting examples (various text types)
    - Error responses (401, 429, 500, malformed JSON)

  maintenance:
    - Update when provider APIs change
    - Add new fixtures for reported bugs
    - Version fixtures with provider API versions

continuous_verification:
  ci_pipeline:
    trigger: every commit, every PR
    steps:
      - Load system dependencies
      - Run unit tests (FiveAM)
      - Run integration tests (mock providers)
      - Run property tests
      - Generate coverage report
      - Fail if coverage < 80%

  pre_release:
    trigger: before version tag
    steps:
      - Full test suite (all levels)
      - Manual smoke tests with real providers
      - Verify backward compatibility
      - Update CHANGELOG.md
      - Tag version

failure_handling:
  test_failure:
    action:
      - Log full error details
      - Show failing test name and assertion
      - Display context (input, expected, actual)
      - Provide reproduction steps

  network_failure:
    action:
      - Skip smoke tests if no API keys
      - Retry transient errors (timeout, 503)
      - Fail clearly on persistent errors (401, 403)

  regression:
    action:
      - Create new test case for bug
      - Verify fix with test
      - Add to regression suite
      - Document in CHANGELOG
